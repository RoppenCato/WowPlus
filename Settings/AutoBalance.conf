# WowPlus overrides for mod-autobalance (dungeons and raids scaled to the size of the party).
#
# The module also scales the experience down with the enemies. Alone in a five-player dungeon
# that left very little (Robin, Sunken Temple at level 50). An elite enemy gives twice the
# experience of a normal one, and scaled down for one player it is about as tough as a normal
# one. With 2 here, a dungeon enemy is worth roughly what an enemy outdoors is worth.
# Raise it to make dungeons the better place to level, lower it for the opposite.
AutoBalance.RewardScaling.XP.Modifier = 2.0