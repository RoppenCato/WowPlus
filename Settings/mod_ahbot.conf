# WowPlus overrides for mod-ah-bot (fills the auction house).
#
# With one real player the auction house would be empty. This module keeps it stocked: gear,
# trade goods, and what professions need. Decided 2026-10-11: the auction house replaces the
# materials vendor in the hub.
#
# The auctions are put up in the name of one character. We use a random-bot character that is
# never online (account RNDBOT59), so the seller looks like any other player.
# How many items, and at what prices, is in the table mod_auctionhousebot:
# Settings/SQL/world/2026-10-11_auction-house.sql.
AuctionHouseBot.EnableSeller = 1
AuctionHouseBot.Account = 60
AuctionHouseBot.GUID = 596

# Also sell what professions need, and trade goods that vendors sell
AuctionHouseBot.ProfessionItems = 1
AuctionHouseBot.VendorTradeGoods = 1

# Count only its own auctions when deciding how much to put up, so yours never crowd it out
AuctionHouseBot.ConsiderOnlyBotAuctions = 1
# At most this many stacks of the same item at a time, so the house shows variety
AuctionHouseBot.DuplicatesCount = 4

# The auction house also buys (decided 2026-10-11: "yes, but reasonable").
# It bids on what you put up, as long as the price is at most the item's vendor sell price times
# a factor by rarity: white 3, green 5, blue 12, epic 15 (table mod_auctionhousebot,
# Settings/SQL/world/2026-10-11_auction-house.sql). Ask more and it stays unsold.
# It looks at 40 random auctions a minute among the thousands that are up, so yours is usually
# noticed within an hour or so, not at once. It bids like a player: if its bid reaches your
# buyout you are paid at once, otherwise when the auction ends.
AuctionHouseBot.EnableBuyer = 1
