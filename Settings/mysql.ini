# MySQL settings for the local WowPlus database.
# Only reachable from this PC (127.0.0.1). Port 3307, so it can run next to MapleStoryPlus (3306).
# The program and data folders (Tools/mysql, Database/) are passed in by the .bat scripts.
[mysqld]
port=3307
bind-address=127.0.0.1
mysqlx=0

# Tuning for playerbots (from the Playerbots configuration guide)
skip-log-bin
# How much RAM MySQL may use for caching. The guide suggests about half of the PC's RAM;
# 8G leaves room for the worldserver and the game client on a 32 GB PC.
innodb_buffer_pool_size=8G
innodb_io_capacity=500
innodb_io_capacity_max=2500
transaction_isolation=READ-COMMITTED

[client]
host=127.0.0.1
port=3307
user=root
