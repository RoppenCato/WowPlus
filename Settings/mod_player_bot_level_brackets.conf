# WowPlus overrides for mod-player-bot-level-brackets.
#
# Switched off: the bot module itself now does this job (Playerbots.LevelBrackets.* in
# Settings/playerbots.conf), and two systems moving bot levels around would fight each other.
# The module stays installed so that nothing has to be rebuilt to switch back.
BotLevelBrackets.Enabled = 0