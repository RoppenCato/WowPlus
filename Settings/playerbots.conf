# WowPlus overrides for playerbots.conf.
#
# Only the settings we changed are listed here; see worldserver.conf in this folder
# for how that works. Every available setting (there are a lot) is explained in
# Server/modules/mod-playerbots/conf/playerbots.conf.dist.

PlayerbotsDatabaseInfo = "127.0.0.1;3307;acore;{DB_PASSWORD};acore_playerbots"

# How many random bots are online. Raise both numbers together for a busier world
# (the module's own default is 500). The first start after raising them takes longer,
# because the new bot accounts and characters have to be created.
Playerbots.MinRandomBots = 100
Playerbots.MaxRandomBots = 100

# ---------------------------------------------------------------------------------------------
# Bots as company for one player (decided 2026-10-11, see Settings/Docs/Bots.md)
# ---------------------------------------------------------------------------------------------

# Bots always accept an invitation to a party or a guild, whatever their level.
Playerbots.GroupInvitationPermission = 2

# Where the bots are in level. About half of them gather in the level range you are in, the rest
# stay spread over every other range, so cities and roads still show all kinds of characters.
# (The bot module has this built in now; the separate module mod-player-bot-level-brackets is
# switched off in Settings/mod_player_bot_level_brackets.conf so the two do not fight.)
Playerbots.LevelBrackets.Enabled = 1
Playerbots.LevelBrackets.Dynamic.UseDynamicDistribution = 1
Playerbots.LevelBrackets.Dynamic.RealPlayerWeight = 12
Playerbots.LevelBrackets.Dynamic.SyncFactions = 1

# Gear. How well each bot is dressed is decided per bot by mod-wowplus (WowPlus.Bots.Gear.* in
# Settings/mod_wowplus.conf): most in green, some with a few blues, a few really well geared.
# These two make them pick sensible pieces: plate for warriors, the right kind of weapon.
Playerbots.PreferClassArmorType = 1
Playerbots.PreferredSpecWeapons = 1

# Talk. The module's own canned replies are off: bots answer through Claude instead
# (Start-Bot-Chat.bat). No rude item-link replies, no Thunderfury jokes.
Playerbots.RandomBotTalk = 0
Playerbots.ToxicLinksRepliesChance = 0
Playerbots.ThunderfuryRepliesChance = 0
# (Emotes are off: with them on, a bot in your party fills the chat with "talks excitedly with you".)
Playerbots.RandomBotEmote = 0
Playerbots.EnableGreet = 1

# Bots walk inside buildings instead of running.
Playerbots.RandombotsWalkingRPG.InDoors = 1

# There should be bots around: bots of your level range gather in the zone you are in.
# (".bots alone on" keeps them away when you want the place to yourself.)
Playerbots.RandomBotConcentrateInPlayerZone = 1

# No arena teams for bots. The bot module puts most high-level bots into arena teams, and bots
# in a team are left alone by the level spread above, which pinned 72 of the 100 bots at level
# 70 to 80 (found 2026-10-11: a level 1 character saw no bots at all). Nobody plays arena here.
Playerbots.RandomBotArenaTeam2v2Count = 0
Playerbots.RandomBotArenaTeam3v3Count = 0
Playerbots.RandomBotArenaTeam5v5Count = 0
Playerbots.DeleteRandomBotArenaTeams = 1
Playerbots.LevelBrackets.IgnoreArenaTeamBots = 0

# Only bots of the faction you play (Robin, 2026-10-11). Vorak is Horde, so all 100 bots that
# are online are Horde. Playing an Alliance character: swap the two numbers and restart.
# These two only decide which side the bots are of until someone has played: after that the bots
# are of the side you play, and switch when you log in on a character of the other side
# (WowPlus.Bots.FollowFaction in mod_wowplus.conf).
Playerbots.RandomBotAllianceRatio = 0
Playerbots.RandomBotHordeRatio = 100

# Bots do not announce that they eat or drink.
Playerbots.AnnounceConsumableUse = 0

# Bots that are not near you are left at the module's default: awake one tenth of the time
# (Playerbots.BotActiveAlone = 10). A bot is always fully awake when it is in your zone, within
# 150 yards of you, in your guild or party, in combat, in a dungeon or battleground, or in a queue,
# so nothing you can see is slowed down. Tried at 100 on 2026-10-12: far-away bots handed in eight
# times the quests, which changes nothing for the player, since the bot manager sets their levels.

# Bot accounts. Left at 0 the module works out how many it needs (70 for 100 bots: 20 for the bots in
# the world, 50 for bots made on request). It counts on five Horde characters per account, but they
# are made by chance: the 20 accounts held 92, so the last 8 places went to Alliance bots although
# Alliance is switched off. With 90 there are enough Horde characters for up to 150 bots.
# The extra accounts are handed to the bots in the world by Settings\Deploy-Settings.ps1 when the
# server starts. For more than 150 bots: about 1 account per 4 bots, plus 50, and start the server
# twice (the first start makes the characters and closes again).
# Measured on 2026-10-12: 100 bots use about one processor core and the world updates in 2 ms;
# 150 bots, all awake, use 1.4 cores and 4 ms. Test-Bots.py shows the current figure.
Playerbots.RandomBotAccountCount = 90
