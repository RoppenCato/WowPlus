# WowPlus overrides for our own module, mod-wowplus.
# Every setting is explained in Server/modules/mod-wowplus/conf/mod_wowplus.conf.dist.
# Copy a line from there to here and change its value; restart the server to apply.

# Rares always drop an extra item (the module's default is 60 percent). Decided 2026-10-11.
# Every extra item is at least green. A rare rolls the rarity three times and keeps the best
# (WowPlus.Loot.RarityRolls.Rare, left at its default), which makes about 1 drop in 5 blue or
# better and 1 in 17 epic or better, against 1 in 12 and 1 in 50 for an ordinary enemy.
WowPlus.Loot.Chance.Rare = 100

# To see in logs/Server.log what the loot rule decides on every kill, set this to 1.
WowPlus.Loot.Debug = 0

# To see in logs/Server.log what surprise stock each vendor was given (spoils the surprise), set this to 1.
WowPlus.Vendors.Debug = 1
