# WowPlus overrides for worldserver.conf.
#
# Only the settings we changed are listed here. Deploy-Settings.ps1 takes the full
# default file (worldserver.conf.dist), applies these lines on top and writes the
# result into the built server. Every available setting and its explanation is in
# Server/src/server/apps/worldserver/worldserver.conf.dist: copy a line from there
# to here and change its value.
#
# {DB_PASSWORD} is filled in from Settings/.env.
# Relative paths start from the server folder, Build/bin/RelWithDebInfo.

# Database connections (our MySQL runs on port 3307)
LoginDatabaseInfo     = "127.0.0.1;3307;acore;{DB_PASSWORD};acore_auth"
WorldDatabaseInfo     = "127.0.0.1;3307;acore;{DB_PASSWORD};acore_world"
CharacterDatabaseInfo = "127.0.0.1;3307;acore;{DB_PASSWORD};acore_characters"

# Folders
DataDir         = "../../../Data"
LogsDir         = "logs"
SourceDirectory = "../../../Server"
MySQLExecutable = "../../../Tools/mysql/bin/mysql.exe"

# Only accept connections from this PC
BindIP = "127.0.0.1"

# Threads that update the maps. Roughly CPU cores minus 2; more than 8 does not help.
MapUpdate.Threads = 6

# How often (minutes) the world server reports itself online. The login server marks the
# realm offline whenever it restarts; with 1 the realm shows as online again within a minute.
UpdateUptimeInterval = 1
