# WowPlus overrides for worldserver.conf.
#
# Only the settings we changed are listed here. Deploy-Settings.ps1 takes the full
# default file (worldserver.conf.dist), applies these lines on top and writes the
# result into the built server. Every available setting and its explanation is in
# Server/src/server/apps/worldserver/worldserver.conf.dist: copy a line from there
# to here and change its value.
#
# {DB_PASSWORD} is filled in from Settings/.env.
# Relative paths start from the server folder, Build/bin/RelWithDebInfo.

# Database connections (our MySQL runs on port 3307)
LoginDatabaseInfo     = "127.0.0.1;3307;acore;{DB_PASSWORD};acore_auth"
WorldDatabaseInfo     = "127.0.0.1;3307;acore;{DB_PASSWORD};acore_world"
CharacterDatabaseInfo = "127.0.0.1;3307;acore;{DB_PASSWORD};acore_characters"

# Folders
DataDir         = "../../../Data"
LogsDir         = "logs"
SourceDirectory = "../../../Server"
MySQLExecutable = "../../../Tools/mysql/bin/mysql.exe"

# Only accept connections from this PC
BindIP = "127.0.0.1"

# Threads that update the maps. Roughly CPU cores minus 2; more than 8 does not help.
MapUpdate.Threads = 6

# How often (minutes) the world server reports itself online. The login server marks the
# realm offline whenever it restarts; with 1 the realm shows as online again within a minute.
UpdateUptimeInterval = 1

# --- Phase 1: solo access to dungeons and raids ---

# Enter raid instances without being in a raid group (alone or in a normal party).
Instance.IgnoreRaid = 1

# Raid quests can be done outside a raid group.
Quests.IgnoreRaid = 1

# --- Phase 5: professions for one player ---

# One character can learn every profession (the game's limit is 2).
MaxPrimaryTradeSkill = 11

# Professions level much faster: each successful skill-up gives 3 points instead of 1,
# and yellow and green recipes skill up far more often (the game: 75 and 25 percent).
SkillGain.Crafting  = 3
SkillGain.Gathering = 3
SkillChance.Yellow  = 100
SkillChance.Green   = 60

# --- Phase 6: travel ---

# Lets modules remember things per character. The hearthstone menu keeps the places a
# character has unlocked this way.
EnablePlayerSettings = 1

# --- Rares: a fight you notice, always possible alone (decided 2026-10-11) ---

# Plain rares (silver dragon frame, 297 of them) were barely stronger than the enemies
# around them: about 10 percent more health and the same damage. Now twice the health
# and a quarter more damage.
Rate.Creature.Elite.RARE.HP          = 2
Rate.Creature.Elite.RARE.Damage      = 1.25
Rate.Creature.Elite.RARE.SpellDamage = 1.25

# Rare elites (silver dragon with wings, 94 of them) were built for groups: on average
# about 3.5 times the health and 4 times the damage of an ordinary enemy. Brought down so
# one player can win: about 2.5 times the health and 1.6 times the damage. Still clearly
# the more dangerous kind.
Rate.Creature.Elite.RAREELITE.HP          = 0.75
Rate.Creature.Elite.RAREELITE.Damage      = 0.4
Rate.Creature.Elite.RAREELITE.SpellDamage = 0.4

# Experience (decided 2026-10-11, see Settings/Docs/Implementation-List.md).
# Kills and quests a little faster than the original game: about 70 to 100 hours to level 80.
Rate.XP.Kill  = 1.5
Rate.XP.Quest = 1.5
# Going somewhere new pays: three times the experience for discovering an area.
Rate.XP.Explore = 3
# Rested experience builds up three times as fast, in an inn and anywhere else.
Rate.Rest.InGame                 = 3
Rate.Rest.Offline.InTavernOrCity = 3
Rate.Rest.Offline.InWilderness   = 3

# One auction house for everyone, whichever faction and whichever auctioneer (decided 2026-10-11).
# It is kept stocked by mod-ah-bot: Settings/mod_ahbot.conf.
AllowTwoSide.Interaction.Auction = 1

# Resetting talents costs nothing (decided 2026-10-11). The second talent set is free too:
# WowPlus.Classes.DualSpecLevel in Settings/mod_wowplus.conf.
NoResetTalentsCost = 1
# The server works out which zone every enemy stands in and writes it to the database while
# starting. The champions are chosen per zone and need it (Settings/SQL/world/..._champions.sql).
Calculate.Creature.Zone.Area.Data = 1
