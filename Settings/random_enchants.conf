# WowPlus overrides for mod-random-enchants.
#
# The module is switched off: it picked the strength of a bonus from the item's colour alone,
# which made low-level greens far too strong. Our own rule in mod-wowplus (settings
# WowPlus.Bonus.*) does the job instead and uses this module's list of bonuses, so the
# module must stay installed.
RandomEnchants.Enable = 0
RandomEnchants.AnnounceOnLogin = 0
