# WowPlus overrides for mod-random-enchants (random bonuses on looted, crafted and quest items).
# Every setting is explained in Server/modules/mod-random-enchants/conf/random_enchants.conf.dist.

# No advertising line at login.
RandomEnchants.AnnounceOnLogin = 0

# Chance in percent for a first, second and third random bonus. Each one is only rolled if the
# one before succeeded. The module's own defaults (70, 65, 60) put bonuses on most items;
# with these, about 1 item in 3 gets one bonus, 1 in 8 gets two and 1 in 20 gets three,
# so a bonus stays something to notice.
RandomEnchants.EnchantChance1 = 35.0
RandomEnchants.EnchantChance2 = 40.0
RandomEnchants.EnchantChance3 = 40.0
